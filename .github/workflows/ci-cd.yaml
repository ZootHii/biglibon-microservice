name: CI/CD Pipeline

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]
  workflow_dispatch:

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_PREFIX: ${{ github.repository_owner }}/biglibon-microservice

jobs:
  ci:
    name: Build and Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run unit checks only
      # -DskipITs: Integration test fazını (Failsafe) atlar.
      # -Dtest: 'integration' paketi altındaki sınıfları çalıştırmaz.
      # Böylece Kafka, ES veya Mongo bağlantısı gerektiren testler koşturulmaz.
        run: mvn -B -ntp clean verify -DskipITs -Dtest=!com.biglibon.*.integration.*

  docker:
    name: Build and Push Images (GHCR + Docker Hub)
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - eureka-server
          - api-gateway
          - book-service
          - library-service
          - catalog-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build JAR for ${{ matrix.service }}
        run: mvn -B -ntp -pl ${{ matrix.service }} -am clean package -DskipTests

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_PREFIX }}-${{ matrix.service }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/biglibon-microservice-${{ matrix.service }}
          tags: |
            type=ref,event=branch

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  docker-stack:
    name: Build and Push biglibon-microservice Image
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta-stack
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_PREFIX }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/biglibon-microservice
          tags: |
            type=ref,event=branch

      - name: Build and push stack image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-stack.outputs.tags }}
          labels: ${{ steps.meta-stack.outputs.labels }}